<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
  <title id="title">OneDrive memory bus</title>
  <desc id="desc">Approved knowledge and component evidence move from a Scout session to the shared OneDrive memory bus. Raw task content stays out of the bus.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="1000" height="400" fill="#ffffff"/>
  <text x="48" y="48" fill="#1f2328" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">OneDrive memory bus</text>
  <text x="48" y="78" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="16">Only approved, privacy-minimized continuity crosses devices.</text>

  <rect x="48" y="112" width="292" height="190" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="72" y="144" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">LOCAL TO THIS DEVICE</text>
  <rect x="72" y="164" width="244" height="106" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="92" y="202" fill="#1f2328" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Scout session</text>
  <text x="92" y="230" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">Current work and native memory</text>
  <text x="92" y="252" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">remain on the device.</text>

  <path d="M340 217 H420" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="102" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">approved capture</text>

  <rect x="428" y="112" width="524" height="190" rx="12" fill="#ddf4ff" stroke="#80ccff" stroke-width="2"/>
  <text x="452" y="144" fill="#0550ae" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SHARED ONEDRIVE FOLDER</text>
  <rect x="452" y="164" width="220" height="106" rx="8" fill="#ffffff" stroke="#80ccff" stroke-width="2"/>
  <text x="472" y="202" fill="#1f2328" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Knowledge base</text>
  <text x="472" y="230" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">Reviewed reusable lessons</text>
  <text x="472" y="252" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">for future sessions.</text>
  <rect x="708" y="164" width="220" height="106" rx="8" fill="#ffffff" stroke="#80ccff" stroke-width="2"/>
  <text x="728" y="202" fill="#1f2328" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Component evidence</text>
  <text x="728" y="230" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">Skill identifiers and</text>
  <text x="728" y="252" fill="#57606a" font-family="Segoe UI, Arial, sans-serif" font-size="15">user-provided outcomes.</text>

  <rect x="48" y="330" width="904" height="42" rx="8" fill="#ffebe9" stroke="#f5a3a3" stroke-width="2"/>
  <text x="72" y="357" fill="#cf222e" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Not shared: raw prompts, transcripts, repository content, paths, identities, or credentials.</text>
</svg>
